# =============================================================
#  instances.yaml — sube este archivo a un repo de GitHub y usa
#  el link "raw" en launcher.config.json (configUrl)
# =============================================================

# Nombre del launcher. Se usa para crear la carpeta en:
#   %APPDATA%/<launcher_name>/
launcher_name: "Euphonic Launcher"

# Nombre de la subcarpeta donde se guardan las instancias.
# Resultado: %APPDATA%/<launcher_name>/<instances_folder>/<nombre_instancia>/
instances_folder: "Instancias"

# INTERRUPTOR GENERAL. Si es false (o si este archivo no se
# puede leer / no existe), el launcher completo queda bloqueado
# y se muestra unauthorized_message.
authorized: false

# Mensaje que se muestra si authorized = false o si no se pudo
# leer el YAML.
unauthorized_message: "Este launcher no está disponible en este momento. Contacta al staff del evento."

# Lista de instancias. Puedes agregar tantas como quieras: van a
# aparecer una al lado de otra en la pantalla de inicio.
instances:
  - id: "thebackrooms2"                # identificador único, no cambia
    name: "thebackrooms2"              # nombre visible (editable)
    icon: "https://raw.githubusercontent.com/likn5649-alt/Euphonic-Launcher/refs/heads/main/image.png"
    background: "https://eufonia.studio/cdn-cgi/image/width=1920,quality=75,format=auto/_next/static/media/01_backrooms2.e544faf8.png"
    # Link de descarga directa de Dropbox. IMPORTANTE: debe terminar
    # en "?dl=1" (no "?dl=0") para que descargue el archivo directo.
    zip_url: "https://www.dropbox.com/scl/fi/eh12mkbjtxe9l1jt3sask/eufonia-minecraft1.zip?rlkey=6tzyfm236fsoz37bfzinm0wel&st=xzh7iegz&dl=1"

    # ---- Lanzar Minecraft directamente al terminar de instalar ----
    # Poniendo minecraft_version, al tocar PLAY el launcher ejecuta
    # Minecraft usando la carpeta que está dentro de "versions/" del
    # zip extraído (igual que hace el launcher oficial), en vez de
    # abrir la carpeta.
    minecraft_version: "1.19.4"
    # Opcional: nombre EXACTO de la carpeta dentro de "versions/"
    # (la que trae el .json y el .jar de Fabric/Forge). Si lo dejas
    # vacío, el launcher detecta automáticamente la única carpeta que
    # haya ahí, o la que tenga "fabric"/"forge"/"quilt" en el nombre.
    # Ejemplo real: "fabric-loader-0.16.14-1.19.4"
    version_id: "fabric-loader-0.16.14-1.19.4"
    # Opcional: solo si tu zip trae su propio Java portable en vez de
    # usar el instalado en el sistema (ruta relativa al .exe/javaw.exe
    # dentro de la carpeta ya extraída).
    java_path: ""

    # Alternativa a lo anterior: si en lugar de lanzar Minecraft
    # querés correr un .bat/.exe propio, usa "executable" (tiene
    # prioridad sobre minecraft_version).
    executable: ""

    # Opcional: pon false para desactivar SOLO esta instancia
    # (sigue apareciendo en la lista pero no se puede jugar).
    authorized: true

  - id: "uhcwebones2"
    name: "uhcwebones2"
    icon: "https://raw.githubusercontent.com/likn5649-alt/Euphonic-Launcher/refs/heads/main/image1.png"
    background: "https://raw.githubusercontent.com/likn5649-alt/Euphonic-Launcher/refs/heads/main/image1.png"
    zip_url: "https://www.dropbox.com/scl/fi/8vplf3su1o2a3jb33ote0/instance.zip?rlkey=yqdhc35nqvadqqgqrt828rxm5&st=t67fghc1&dl=1"
    executable: ""
    authorized: true
    minecraft_version: "1.19.4"
    version_id: "fabric-loader-0.16.14-1.19.4"
